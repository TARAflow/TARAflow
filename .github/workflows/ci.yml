# .github/workflows/ci.yml
#
# Continuous integration: type-check, test and web build on every push and PR,
# on both Linux and Windows. Does NOT build installers — that is release.yml,
# triggered by tags. Keeping installers out of CI keeps PR feedback fast.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see Linux result even if Windows fails, and vice versa
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci = clean, lockfile-exact install. Fails if package-lock.json is
      # out of sync, which is what you want in CI.
      - name: Install dependencies
        run: npm ci

      - name: Type-check + web build
        run: npm run build

      - name: Run tests
        run: npm test -- --run
        # `vitest` defaults to watch mode; --run forces a single pass and a
        # proper exit code for CI.
