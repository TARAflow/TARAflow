# .github/workflows/ci.yml
#
# Continuous integration: type-check, test and web build on every push and PR,
# on both Linux and Windows. Does NOT build installers — that is release.yml,
# triggered by tags. Keeping installers out of CI keeps PR feedback fast.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see Linux result even if Windows fails, and vice versa
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # npm ci = clean, lockfile-exact install. Fails if package-lock.json is
      # out of sync, which is what you want in CI.
      - name: Install dependencies
        run: npm ci

      - name: Type-check + web build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      # Phase 7 guardrail: fails the build if anything in the generation
      # path imports a feature barrel, react, @mui, or a window-coupled
      # module. Severity is already "error" in the config (see Phase 1).
      - name: Purity boundary check (dependency-cruiser)
        run: npx depcruise --config utils/depcruise-doc.cjs --output-type err-long src/features/documentation/utils

      # Phase 7 smoke test: build the CLI bundle and run it against the
      # fixture project exactly as a real user would. Linux-only because
      # the shell check below (test -s) isn't portable to Windows runners;
      # the underlying esbuild/node pipeline itself is cross-platform.
      - name: CLI smoke test (build + run against fixture)
        if: runner.os == 'Linux'
        run: |
          npm run build:cli
          node dist-cli/taraflow-report.js src/tests/fixtures/Simple_Test_Project.tara.json --format markdown --out /tmp/ci-report.md
          test -s /tmp/ci-report.md
       # `vitest` defaults to watch mode; --run forces a single pass and a
       # proper exit code for CI.
